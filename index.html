<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ButPicker</title>
  </head>
  <body>
    <div id="app">
      <div class="tabbar">
        <div class="tabs" id="tabs"></div>
        <button class="tab-add" id="add-tab" title="Open a project (Ctrl+T)">+</button>
        <div class="tabbar-spacer"></div>
        <div class="hints">
          <kbd>Ctrl+T</kbd> project
          <kbd>Ctrl+Shift+T</kbd> terminal
          <kbd>Ctrl+Tab</kbd> switch
        </div>
      </div>

      <div class="views" id="views">
        <div class="empty hidden" id="empty">
          <h1>ButPicker</h1>
          <p>The GitButler TUI and a terminal, side by side, for any repo under your git root.</p>
          <button class="btn primary" id="empty-add">Open a repo&hellip;</button>
        </div>
      </div>
    </div>

    <div class="modal hidden" id="modal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
