# Tauri on Windows needs the MSVC toolchain. The windows-gnu toolchain builds
# some of the dependency tree only if MinGW's dlltool.exe is on PATH, which it
# generally isn't, so pin the project rather than rely on the machine default.
[toolchain]
channel = "1.93-x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
